# Handoff template: Claude owns .github/. Install there through its owner.
name: Blender assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: python -m pip install numpy scipy pillow
      - run: node --import tsx tools/blender/export-parameters.ts
      - run: node node_modules/vitest/vitest.mjs run --config tools/blender/vitest.config.ts
      - run: python -m unittest discover -s tools/blender/tests -p test_geometry.py
      # The reviewed catalogue is already packaged; the prototype build overwrites it.
      - run: python tools/blender/audit_payloads.py
      - uses: actions/upload-artifact@v4
        with:
          name: blender-assets
          path: |
            public/models/
