name: Blender Python checks

# The Blender asset pipeline's checks, split out of ci.yml (it used to be the
# `blender-python` job there). They only matter when the pipeline, the catalogue
# it reads or the generated models change, so this workflow only starts for
# those paths. That is safe here, and it is why it is a workflow of its own:
# this is NOT a required check. ci.yml's `checks` job must never use
# workflow-level `paths`, because a required check whose workflow never starts
# stays "Pending" forever; this one may.
#
# Same budget rules as ci.yml:
#   - push runs on `main` only (a PR branch would otherwise run every commit
#     twice), plus workflow_dispatch to run it on any ref.
#   - Draft PRs do not run it (the job is skipped); marking one ready does.
#
# `bpy` (a ~340 MB wheel) is deliberately not installed (AGENTS.md): the
# Blender-specific tests skip themselves with an explicit reason, and the
# generation itself runs by hand.
on:
  push:
    branches: [main]
    paths:
      - "tools/blender/**"
      - "public/models/**"
      - "src/db/seed/**"
      - "src/lib/contracts/descriptors.ts"
      - ".github/workflows/blender-python.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/blender/**"
      - "public/models/**"
      - "src/db/seed/**"
      - "src/lib/contracts/descriptors.ts"
      - ".github/workflows/blender-python.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blender-python:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Versions checked on 2026-09-30 with `gh api repos/<owner>/<repo>/releases/latest`
      # and each major tag's action.yml (`runs.using: node24`): checkout v7.0.1,
      # setup-node v7.0.0, setup-python v7.0.0, upload-artifact v7.0.1.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The parameter export runs through tsx, which comes from package.json.
      - run: npm ci
      - run: node --import tsx tools/blender/export-parameters.ts
      # opencv-python-headless: tools/blender/reconstruct_views.py and the photo
      # camera-fit tests (tests/test_photo_camera_fit.py on the study branches)
      # import cv2; without it those tests failed on every run.
      - run: python -m pip install numpy scipy pillow opencv-python-headless
      # Blender-specific tests self-skip here with an explicit bpy reason.
      - run: python -m unittest discover -s tools/blender/tests -p 'test_*.py'
      - run: python tools/blender/check_catalogues.py
      - run: python tools/blender/audit_payloads.py
      - run: python tools/blender/optimize_glbs.py --check
      # The exported shell parameters the checks above read, for reading a failure.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: blender-shell-parameters
          path: tools/blender/out/
          retention-days: 3
          if-no-files-found: ignore
