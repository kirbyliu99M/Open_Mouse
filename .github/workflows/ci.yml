name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - name: Check migration history and schema drift
        run: |
          npm run db:check
          npm run db:generate
          test -z "$(git status --porcelain -- drizzle)"
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - run: npm run vercel-build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  blender-python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: node --import tsx tools/blender/export-parameters.ts
      - run: python -m pip install numpy scipy pillow
      # Blender-specific tests self-skip here with an explicit bpy reason.
      - run: python -m unittest discover -s tools/blender/tests -p 'test_*.py'
      - run: python tools/blender/check_catalogues.py
      - run: python tools/blender/audit_payloads.py
      - run: python tools/blender/optimize_glbs.py --check
