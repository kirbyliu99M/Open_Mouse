name: CI

# Budget-conscious by design (GitHub Actions minutes are limited, and a billing
# block on 2026-09-29 stopped CI once already), even though a public repo on a
# standard runner is documented as free.
#
#   - push runs on `main` only. A PR branch used to trigger both `push` and
#     `pull_request` on every commit, so the same commit ran twice.
#   - Draft PRs do not run CI (the job is skipped); marking one ready does.
#   - PRs run the whole gate, including Playwright on every project.
#   - A push to `main` runs the light gate only: typecheck, lint, format, unit
#     tests, migration check, `npm audit`, build. The full e2e already passed on
#     the PR that was merged.
#   - A docs-only change (`docs/**` and `*.md`) skips install, tests and build.
#     That is decided INSIDE the job, not with workflow-level `paths` /
#     `paths-ignore`: a workflow that never starts leaves a required check
#     stuck on "Pending", whereas a job that starts and finishes green does not.
#   - workflow_dispatch runs everything, e2e included, on whatever ref you pick.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Required-check name for branch protection: "checks".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Action versions checked on 2026-09-30 with `gh api repos/<owner>/<repo>/releases/latest`
      # and each tag's action.yml (`runs.using: node24`): checkout v7.0.1,
      # setup-node v7.0.0, cache v6.1.0, upload-artifact v7.0.1.
      - uses: actions/checkout@v7

      - name: Classify changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Fail safe: anything we cannot classify runs the full gate.
          heavy=true
          reason="no base commit to compare against"
          base=""
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
          esac
          changed="$RUNNER_TEMP/changed-files.txt"
          : > "$changed"
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            # Shallow checkout: fetch just the base commit. A PR checkout is the
            # merge commit, so base..HEAD is exactly what the PR changes.
            if git fetch --no-tags --depth=1 origin "$base" \
              && git diff --name-only --no-renames "$base" HEAD > "$changed"; then
              if [ -s "$changed" ]; then
                heavy=false
                reason="only docs/** and *.md changed"
                while IFS= read -r file; do
                  case "$file" in
                    docs/* | *.md) ;;
                    *)
                      heavy=true
                      reason="non-docs change: $file"
                      break
                      ;;
                  esac
                done < "$changed"
              else
                reason="empty diff"
              fi
            else
              reason="could not diff against $base"
            fi
          fi
          # e2e: every PR and manual run, never a push to main.
          e2e=false
          if [ "$heavy" = "true" ] && [ "$EVENT_NAME" != "push" ]; then e2e=true; fi
          {
            echo "heavy=$heavy"
            echo "e2e=$e2e"
            echo "changed_file=$changed"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Changed paths"
            echo "- event: \`$EVENT_NAME\`"
            echo "- full gate: **$heavy** ($reason)"
            echo "- e2e: **$e2e**"
            echo "- files: $(wc -l < "$changed")"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "heavy=$heavy e2e=$e2e ($reason)"

      # Docs-only path. Prettier also checks Markdown, so skipping it entirely
      # would let a badly formatted .md merge and then fail `format:check` on the
      # next code PR. This runs Prettier alone (no `npm ci`), pinned to the
      # version in package.json, on just the changed files.
      - name: Prettier on the changed docs
        if: steps.changes.outputs.heavy != 'true'
        env:
          CHANGED_FILE: ${{ steps.changes.outputs.changed_file }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').devDependencies.prettier")"
          existing=()
          while IFS= read -r file; do
            if [ -f "$file" ]; then existing+=("$file"); fi
          done < "$CHANGED_FILE"
          if [ "${#existing[@]}" -eq 0 ]; then
            echo "Only deletions; nothing to format-check."
            exit 0
          fi
          npx --yes "prettier@${version}" --check --ignore-unknown "${existing[@]}"

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.heavy == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.heavy == 'true'
      - run: npm run typecheck
        if: steps.changes.outputs.heavy == 'true'
      - run: npm run lint
        if: steps.changes.outputs.heavy == 'true'
      - run: npm run format:check
        if: steps.changes.outputs.heavy == 'true'
      - run: npm run test
        if: steps.changes.outputs.heavy == 'true'
      - name: Check migration history and schema drift
        if: steps.changes.outputs.heavy == 'true'
        run: |
          npm run db:check
          npm run db:generate
          test -z "$(git status --porcelain -- drizzle)"
      # --omit=dev on purpose: dev dependencies carry known moderate advisories
      # (drizzle-kit's @esbuild-kit chain) that never ship to production.
      - name: Audit production dependencies
        if: steps.changes.outputs.heavy == 'true'
        run: npm audit --omit=dev

      # Playwright browsers, cached by the locked @playwright/test version. The
      # step runs on main pushes too so main seeds the cache that PRs restore
      # (a PR can only read caches from its own ref, its base and the default
      # branch); on main it costs one browser download per Playwright version.
      - name: Read the locked Playwright version
        id: playwright
        if: steps.changes.outputs.heavy == 'true'
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        if: steps.changes.outputs.heavy == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browser and system dependencies
        if: steps.changes.outputs.heavy == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Playwright system dependencies only (browser restored from cache)
        if: steps.changes.outputs.e2e == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Every project in playwright.config.ts: chromium, mobile, chromium-camera,
      # chromium-camera-partial, chromium-camera-paper-edge.
      - name: Playwright e2e
        if: steps.changes.outputs.e2e == 'true'
        run: npm run test:e2e

      - run: npm run vercel-build
        if: steps.changes.outputs.heavy == 'true'

      - uses: actions/upload-artifact@v7
        if: failure() && steps.changes.outputs.e2e == 'true'
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
